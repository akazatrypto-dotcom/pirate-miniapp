<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Pirate TON</title>

  <!-- Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    button {
      background: #22c55e;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🏴‍☠️ Pirate TON</h1>

  <div class="box" id="userBox">
    جاري تحميل بياناتك...
  </div>

  <button onclick="showAlert()">اختبار زر</button>

  <script>
    async function registerUser() {
  const user = window.Telegram.WebApp.initDataUnsafe.user;
  if (!user) return;

  await fetch("/api/register-user", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      telegram_id: user.id,
      username: user.username ?? "",
    }),
  });
}

registerUser();
    const tg = window.Telegram.WebApp;
    tg.ready();

    const user = tg.initDataUnsafe.user;

    if (user) {
      document.getElementById("userBox").innerHTML = `
        <p>👤 ID: ${user.id}</p>
        <p>📛 Username: @${user.username ?? "بدون"}</p>
      `;
    } else {
      document.getElementById("userBox").innerText =
        "❌ افتح التطبيق من داخل تلجرام";
    }

    function showAlert() {
      tg.showAlert("✅ التطبيق شغال تمام!");
    }
  </script>

</body>
</html>
